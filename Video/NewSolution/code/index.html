<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>2018 臺北市長選舉 開票看板</title>
<meta name="viewport" content="width=2560, height=1440">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #05080f; color: #fff; font-family: "GenSekiGothic TW H","源石黑體 H","GenSekiGothic TW","源石黑體","Microsoft JhengHei","Noto Sans TC","PingFang TC","Heiti TC",system-ui,Arial,sans-serif; overflow: hidden; }
  #canvas { display: block; margin: 0 auto; image-rendering: crisp-edges; }
  #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #05080f; display: flex; align-items: center; justify-content: center; font-size: 32px; z-index: 100; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="loading">載入中…</div>
<canvas id="canvas" width="2560" height="1440"></canvas>

<!-- 資料載入：優先用實體檔，失敗則用內嵌備援 -->
<script src="board.js"></script>
<script>
  // 檢查 board.js 是否成功載入（window.BOARD 存在）
  if (typeof window.BOARD === 'undefined') {
    console.warn('board.js 載入失敗，嘗試內嵌備援 board.assets.js');
    var s = document.createElement('script');
    s.src = 'board.assets.embedded.js';
    s.onload = initApp;
    s.onerror = function() { document.getElementById('loading').textContent = '資料載入失敗'; };
    document.head.appendChild(s);
  } else {
    initApp();
  }
</script>

<!-- 引擎核心 -->
<script src="_engine/js/core/utils.js"></script>
<script src="_engine/js/core/theme.js"></script>
<script src="_engine/js/core/layout.js"></script>
<script src="_engine/js/model/election-model.js"></script>
<script src="_engine/js/render/geo-projector.js"></script>
<script src="_engine/js/render/layers.js"></script>
<script src="_engine/js/slide.js"></script>
<script src="_engine/js/app.js"></script>

<script>
function initApp() {
  document.getElementById('loading').classList.add('hidden');
  
  // 建立看板
  NT.BoardFactory.create(window.BOARD).then(function(slide) {
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    
    // 響應式縮放（保持 16:9）
    function resize() {
      var scale = Math.min(window.innerWidth / 2560, window.innerHeight / 1440);
      canvas.style.transform = 'scale(' + scale + ')';
      canvas.style.transformOrigin = 'top center';
    }
    window.addEventListener('resize', resize);
    resize();
    
    // 渲染
    slide.render(ctx, 1);
    
    // 下載 PNG 功能（開發用）
    window.downloadPNG = function(scale) {
      scale = scale || 1;
      var c = document.createElement('canvas');
      c.width = 2560 * scale;
      c.height = 1440 * scale;
      var cctx = c.getContext('2d');
      slide.render(cctx, scale);
      c.toBlob(function(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = '2018-taipei-mayor_' + (2560*scale) + 'x' + (1440*scale) + '.png';
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/png');
    };
    
    console.log('2018 臺北市長選舉看板就緒。可用 downloadPNG(1) 或 downloadPNG(2) 下載圖片。');
  }).catch(function(err) {
    console.error('看板建立失敗:', err);
    document.getElementById('loading').textContent = '看板建立失敗：' + err.message;
    document.getElementById('loading').classList.remove('hidden');
  });
}
</script>
</body>
</html>
